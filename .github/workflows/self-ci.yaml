name: Self CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yaml

  secret-scan:
    name: Secret scan
    permissions:
      contents: read
    uses: $/.github/workflows/secret-scan.yaml
