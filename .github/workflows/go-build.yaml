name: Go-Build
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version"
        required: false
        type: string
        default: "1.22"
      golangci-lint-version:
        description: "GolangCI Lint version"
        required: false
        type: string
        default: "v2.15.0"
      coverage-threshold-file:
        description: "Coverage threshold for a single file"
        required: false
        type: number
        default: 80
      coverage-threshold-package:
        description: "Coverage threshold for a package"
        required: false
        type: number
        default: 80
      coverage-threshold-total:
        description: "Coverage threshold for the total coverage"
        required: false
        type: number
        default: 95
      envtest-k8s-version:
        description: "Kubernetes version of the envtest binaries to install; empty skips envtest"
        required: false
        type: string
        default: ""
      setup-envtest-version:
        description: "setup-envtest version, matching the repo's controller-runtime release branch"
        required: false
        type: string
        default: "release-0.19"
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go-version }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ inputs.golangci-lint-version }}
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go-version }}
      - name: Install dependencies
        run: |
          go mod download
          go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest
      - name: Install envtest binaries
        if: inputs.envtest-k8s-version != ''
        env:
          SETUP_ENVTEST_VERSION: ${{ inputs.setup-envtest-version }}
          ENVTEST_K8S_VERSION: ${{ inputs.envtest-k8s-version }}
        run: |
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
          assets="$(setup-envtest use "${ENVTEST_K8S_VERSION}" --bin-dir "${RUNNER_TEMP}/envtest" -p path)"
          echo "KUBEBUILDER_ASSETS=${assets}" >> "$GITHUB_ENV"
      - name: Test with Go (with coverage report)
        id: test
        run: go test -coverprofile cover.out -json ./... | tee test.out
      - name: Display test results
        run: |
          cat test.out | go-ctrf-json-reporter -output ctrf-report.json
          npx github-actions-ctrf ctrf-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cover.out
          path: cover.out
      - name: Check test results
        run: |
          cat ctrf-report.json | jq '.results.summary' > summary.json
          cat summary.json
          if [ $(jq '.failed' summary.json) -gt 0 ]; then
            echo "Tests failed"
            exit 1
          else
            echo "Tests passed"
          fi
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cover.out
      - uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5
        with:
          name: cover.out
      - name: Check test coverage
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609 # v2
        with:
          profile: cover.out
          local-prefix: github.com/org/project
          threshold-file: ${{ inputs.coverage-threshold-file }}
          threshold-package: ${{ inputs.coverage-threshold-package }}
          threshold-total: ${{ inputs.coverage-threshold-total }}
