name: Secret scan
on:
  workflow_call:
    inputs:
      config:
        description: "Path to a gitleaks config (default: .gitleaks.toml if present, else built-in rules)"
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: "Fail the job when secrets are found"
        required: false
        type: boolean
        default: true
  # Self-test for this repo. Move to self-ci.yaml once it exists.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        shell: bash
        env:
          CONFIG: ${{ inputs.config }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The workspace is owned by the runner user, not root. Without this git refuses
          # the repo and gitleaks passes without scanning anything (gitleaks#2129).
          git config --global --add safe.directory "$PWD"
          git log -1 --oneline

          # Scan only new commits on PRs and pushes, full history otherwise.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_EVENT_NAME" != push ]; then
            range=HEAD
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            range=HEAD # first push or force-push to the default branch
          else
            range="origin/$DEFAULT_BRANCH..$AFTER" # new branch or force-push
          fi
          echo "Scanning $range"

          args=(git "--log-opts=$range" --redact --verbose --no-banner)
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          if [ "$FAIL_ON_FINDINGS" = false ]; then args+=(--exit-code 0); fi
          gitleaks "${args[@]}" .
