name: Get-Docker-Tag
on:
  workflow_call:
    inputs:
      github-ref:
        description: Github ref name
        type: string
    outputs:
      image-tag:
        description: Docker image tag
        value: ${{ jobs.tag.outputs.image-tag }}
jobs:
  tag:
    name: Extract Docker image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_REF: ${{ inputs.github-ref }}
        run: |
          echo "github ref: ${INPUT_REF}"
          if [[ "$INPUT_REF" == main ]]; then
            echo main branch
            tag=latest
          elif [[ "$INPUT_REF" =~ ^v[0-9]+ ]]; then
            echo versioned tag
            tag="${INPUT_REF#v}"
          else
            echo generic ref
            tag="$INPUT_REF"
          fi
          echo "tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
