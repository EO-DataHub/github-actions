name: Publish to S3 bucket

on:
  workflow_call:
    inputs:
      APP_ARTIFACT:
        description: Name of an existing app artifact directory, e.g. workflow-artifact
        required: true
        type: string
      S3_PATH:
        description: Full S3 path, e.g. s3://bucket-name/path/to/folder
        required: true
        type: string
      AWS_REGION:
        description: AWS region, e.g. us-east-1
        required: true
        type: string
      AWS_ROLE_ARN:
        description: AWS role ARN e.g. arn:aws:iam::1234567890:role/role-name
        required: true
        type: string
jobs:
  s3:
    runs-on: ubuntu-latest
    # The AWS role trusts only the caller's release environment.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log message
        env:
          APP_ARTIFACT: ${{ inputs.APP_ARTIFACT }}
          S3_PATH: ${{ inputs.S3_PATH }}
        run: echo "Uploading ${APP_ARTIFACT} to ${S3_PATH}"
      - name: Download app artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.APP_ARTIFACT }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.AWS_REGION }}
      - name: Deploy static site to S3 bucket
        env:
          S3_PATH: ${{ inputs.S3_PATH }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" = "branch" ]]; then cache=no-cache; else cache=max-age=31536000; fi
          aws s3 sync . "${S3_PATH}" --delete --cache-control "${cache}"
