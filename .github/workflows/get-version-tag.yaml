name: Get-Version-Tag
on:
  workflow_call:
    inputs:
      github-ref:
        description: Github ref name
        type: string
    outputs:
      version:
        description: Version tag
        value: ${{ jobs.tag.outputs.version }}
jobs:
  tag:
    name: Extract version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_REF: ${{ inputs.github-ref }}
        run: |
          echo "github ref: ${INPUT_REF}"
          if [[ "$INPUT_REF" == main ]]; then
            echo main branch
            tag=latest
          elif [[ "$INPUT_REF" =~ ^v[0-9]+ ]]; then
            echo versioned tag
            tag="${INPUT_REF#v}"
          else
            echo generic ref
            tag="$INPUT_REF"
          fi
          echo "tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
